[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minifyjs"
version = "0.1.3"
description = "A native JavaScript minifier and optimizer. No Node.js required."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "MinifyJS contributors" }]
keywords = ["javascript", "minifier", "optimizer", "esbuild", "cli", "tree-sitter", "teloce-py", "Node", "django", "flask", "flaxon", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",

    

    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Compilers",
   





    

    




]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "mypy>=1.8",
    "ruff>=0.4",
]
[project.urls]
Homepage = "https://aldanedev-create.github.io/minifyjs-docs/"
Documentation = "https://aldanedev-create.github.io/minifyjs-docs/"
Repository = "https://github.com/aldanedev-create/minifyjs"
Issues = "https://github.com/aldanedev-create/minifyjs/issues"

[project.scripts]
minifyjs = "minifyjs.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["minifyjs*"]

[tool.setuptools.package-data]
minifyjs = ["bin/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.mypy]
strict = true
files = ["minifyjs"]
python_version = "3.14"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_reexport = true