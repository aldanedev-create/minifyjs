# golangci-lint configuration for the MinifyJS core module.
#
# The enabled linter set is deliberately conservative: everything
# here is either a correctness check or a stylistic rule that the
# whole codebase already satisfies. Adding a linter should be a
# deliberate decision, not a default.

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true

linters:
  disable-all: true
  enable:
    # Correctness
    - errcheck       # unchecked errors
    - gosimple       # simplify suggestions
    - govet          # standard vet checks
    - ineffassign    # ineffectual assignments
    - staticcheck    # the big one
    - unused         # unused identifiers
    - bodyclose      # http response bodies
    - contextcheck   # context propagation
    - durationcheck  # time.Duration multiplication
    - errorlint      # error wrapping correctness
    - exportloopref  # loop variable escape
    - makezero       # make with non-zero length misuse
    - nilerr         # return nil after checking err != nil
    - noctx          # http requests without context
    - rowserrcheck   # sql.Rows.Err
    - sqlclosecheck  # sql.Close
    - wastedassign

    # Style (only rules the codebase follows)
    - gofmt
    - goimports
    - misspell
    - revive
    - unconvert
    - unparam

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  govet:
    enable-all: true
    disable:
      - fieldalignment  # too noisy for structs we control
  revive:
    rules:
      - name: exported
        arguments:
          - disableStutteringCheck
  staticcheck:
    checks:
      - all
      - -ST1000  # package comment — enforced by review, not lint
      - -ST1003  # initialisms — we use js not JS in public names
  misspell:
    locale: US

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - unparam
        - gosimple
    - path: internal/engine
      linters:
        - unparam   # esbuild options produce unused params sometimes

  max-issues-per-linter: 0
  max-same-issues: 0
  new: false